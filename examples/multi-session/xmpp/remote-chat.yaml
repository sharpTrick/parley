identity:
  handle: "owner"           # Distinct from both code-agent-*.yaml: on XMPP it IS the sender.
topics:
  - "ctx-payments"
  - "ctx-infra"
# post_topics:             # OPTIONAL: let chat post to ad-hoc topics it doesn't subscribe to
#   - "ctx-.*"             #   full-match regexes; post/fetch only, never subscribed
catchup:
  on_start: false
  limit: 100
live_push:
  enabled: false
presence:
  enabled: false          # reactive-only chat can't receive pushes → skip heartbeats (DESIGN §7)
permissions:
  skip_permissions: false

# Run with: parley-xmpp --config <this file>   (the binary selects the backend)
backend_config:
  service: "xmpp://xmpp.internal:5222"   # identical to both code-agent-*.yaml
  domain: "parley.local"                  # identical
  muc_service: "muc.parley.local"         # identical
  username: "parley"                       # identical
  password: "change-me"                    # identical
  # `nick` left unset — this config posts as its own `identity.handle` ("owner"), which is what
  # keeps it distinct from both Code sessions on this shared account. See code-agent-a.yaml.
