instance_id: "code-agent-b"
identity:
  handle: "agent-b"                       # Distinct from code-agent-a.yaml's: on XMPP it IS the sender.
topics:
  - "ctx-infra"
catchup:
  on_start: true
  limit: 50
live_push:
  enabled: true
  mention_filter: false
permissions:
  skip_permissions: false

# Run with: parley-xmpp --config <this file>   (the binary selects the backend)
backend_config:
  service: "xmpps://xmpp.internal:5223"  # identical to code-agent-a.yaml
  domain: "parley.local"                  # identical
  muc_service: "muc.parley.local"         # identical
  username: "parley"                       # identical — fine, see code-agent-a.yaml's nick note
  password: "change-me"                    # identical
  # `nick` left unset here too — this session posts as its own `identity.handle` ("agent-b").
  # Do NOT copy a pinned `nick`, or a handle, from another config; see code-agent-a.yaml for why.
