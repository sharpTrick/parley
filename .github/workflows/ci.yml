name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a branch be validated without opening a PR (Actions → CI → Run workflow → pick the ref).
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # >=22.0.0 is the declared floor (package.json "engines"); also cover the newer LTS line.
        node-version: ["22.x", "24.x"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run build

      # Every server the suites can use, via the same script maintainers run locally
      # (examples/dev-compose/dev-infra.sh) rather than a second copy of the recipes here — so CI
      # and the dev path cannot drift. Brings up redis, nats, postgres, prosody, synapse and
      # keycloak, waits for each to genuinely serve, and seeds the `parley` test account.
      #
      # Without this the suites do not fail — they `describe.skip` themselves and CI goes green
      # having never exercised them. Before this step ran, 7 of 57 test files were skipped on every
      # build, including the conformance suites for the two largest plugins (bridge-matrix at 803
      # lines and bridge-xmpp at 674) and the entire external-OIDC auth path.
      - name: Start backing services (redis, nats, postgres, xmpp, matrix, keycloak)
        run: ./examples/dev-compose/dev-infra.sh up all

      # One run, two reporters: the readable log for humans and JSON for the skip gate below.
      - run: npm test -- --reporter=default --reporter=json --outputFile=/tmp/vitest.json

      # A self-skipping suite is indistinguishable from a passing one in the summary line, so
      # assert the property this job exists to provide: on CI, no file skips. Any backend whose
      # server failed to come up silently removes its own coverage and still reports success.
      - name: Assert no test file skipped entirely
        run: |
          node -e '
            const r = require("/tmp/vitest.json");
            const dead = r.testResults.filter(
              (f) => f.assertionResults.length > 0 && f.assertionResults.every((a) => a.status === "skipped"),
            );
            if (dead.length) {
              console.error("these test files skipped ENTIRELY — their server was unreachable:");
              for (const f of dead) console.error("  " + f.name);
              process.exit(1);
            }
            console.log(`ok: 0 of ${r.testResults.length} test files skipped entirely`);
          '

      - name: Server logs on failure
        if: failure()
        run: docker compose -f examples/dev-compose/docker-compose.yml logs --tail=200

  # Catch release-publish failures on the PR, not post-merge when release.yml runs on main. The
  # release publishes with OIDC / trusted publishing, which can't bootstrap a brand-new package —
  # so a PR that adds one (or one whose tarball won't build) would go green here but split the
  # registry on the next release. This gate fails the PR instead. Read-only against the registry.
  publish-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - run: npm ci
      - run: npm run build # pack validates the built dist/, so build first
      - run: npm run preflight:publish
