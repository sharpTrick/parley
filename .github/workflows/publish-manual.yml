name: Publish (manual)

# Manual escape hatch, for two cases:
#   1. First publish of a brand-new package (before it has a trusted publisher / has never been
#      on the registry) — run this once the new package exists in the tree.
#   2. Recovery: an automated release published only some packages (registry hiccup). Re-run
#      this with that release's version; publish-workspaces.mjs skips the ones already out.
#
# Pick the ref (branch/tag) to publish from in the "Run workflow" dialog; give the version to
# stamp. Idempotent — safe to re-run.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp & publish (e.g. 0.2.0)"
        required: true

permissions:
  id-token: write # OIDC trusted publishing + npm provenance
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      # Install and build on the npm bundled with Node 22, exactly like ci.yml and release.yml.
      - run: npm ci
      - run: npm run build

      # Only now upgrade npm, and only as far as release.yml does. This used to be
      # `npm install -g npm@latest` placed BEFORE `npm ci`, which is doubly wrong: npm 12
      # (2026-07-08) stopped building better-sqlite3's native binary under `npm ci` — the exact
      # breakage release.yml pins away from — so the recovery path installed with the known-bad
      # npm and then published from that tree. This is the escape hatch used when a release has
      # already gone wrong; it must be the most conservative path, not the least.
      - name: Ensure npm supports trusted publishing
        run: npm install -g "npm@^11.5.1"

      - run: node scripts/stamp-version.mjs "${{ inputs.version }}"
      - run: node scripts/publish-workspaces.mjs
