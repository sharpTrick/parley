name: Release

# A merge to main IS a release (gated by your PR review). On every push to main this runs the
# full test gate; if it passes, semantic-release reads the conventional commits since the last
# vX.Y.Z tag, decides the bump, creates the tag + GitHub Release, stamps that one version across
# all workspaces (lockstep), and publishes every public package to npm with provenance via
# trusted publishing (OIDC — no NPM_TOKEN).
#
# No bump is committed back to main: the git tag + npm are the source of truth for the current
# version. Keep non-release work on feature/dev branches. If tests fail, semantic-release never
# runs, so a red main never publishes.

on:
  push:
    branches: [main]

# Never let two releases publish at once; don't cancel an in-flight publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # semantic-release pushes the tag + creates the GitHub Release
  id-token: write # OIDC trusted publishing + npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history + tags to compute the bump

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      # --- Test gate (mirrors ci.yml, including the no-skip assertion) ---
      # Runs on the npm bundled with Node 22 (via setup-node), exactly like ci.yml. Do NOT upgrade npm
      # before this gate: npm 12 (2026-07-08) changed install handling so `npm ci` no longer builds
      # better-sqlite3's native binary — which turned the whole SQLite suite red here on 2026-07-11 while
      # ci.yml (bundled npm) stayed green. The npm upgrade needed for trusted publishing runs after the gate.
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck:test --workspaces --if-present
      - run: npm run typecheck --workspaces --if-present

      # Same one-command bring-up as ci.yml and as a maintainer's laptop — the recipes live in
      # examples/dev-compose/, never duplicated into workflow YAML. A release must not publish on
      # a gate weaker than the PR's.
      - name: Start backing services (redis, nats, postgres, xmpp, matrix, keycloak)
        run: ./examples/dev-compose/dev-infra.sh up all

      - run: npm test -- --reporter=default --reporter=json --outputFile=/tmp/vitest.json

      # Publishing on a green-because-it-skipped run is the failure this guards against.
      - name: Assert no test skipped itself
        run: node scripts/assert-no-skipped-tests.mjs /tmp/vitest.json

      - name: Server logs on failure
        if: failure()
        run: docker compose -f examples/dev-compose/docker-compose.yml logs --tail=200

      # --- Release: bump decided from commits, tag + GitHub Release, lockstep npm publish ---
      # Trusted publishing (OIDC) needs npm >= 11.5.1, newer than Node 22 bundles — upgrade npm ONLY here,
      # for the publish, never before the test gate. Pinned below the 12 major (npm 12 is what broke the
      # gate above); ^11.5.1 keeps trusted publishing on the known-good line that last published cleanly.
      - name: Ensure npm supports trusted publishing
        run: npm install -g "npm@^11.5.1"

      - name: semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
